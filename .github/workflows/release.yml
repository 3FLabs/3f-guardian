name: Release

on:
  push:
    branches: [main]

# No workflow-level permissions: grants live on the jobs that need them, so
# the called CI verify job (which runs `bun install` and the full test suite
# against third-party code) never sees a write-capable token.
permissions: {}

# Don't ever publish twice from concurrent main pushes.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Run the full CI suite (build + lint + format + typecheck + test) before doing
  # anything releasey. Every downstream job blocks on this, so a red test never
  # reaches changesets — neither the version PR nor the publish.
  # Verification only needs to read the repo.
  verify:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  # Decide what this push should do, before any write-scoped token exists:
  #   `version` — pending changesets, so open/update the Version Packages PR
  #   `publish` — no changesets and unpublished versions, so release them
  #   `none`    — nothing to do
  # Splitting this out is what lets `version` and `publish` be separate jobs
  # with disjoint permissions instead of one job holding every grant.
  select-mode:
    needs: verify
    name: select changesets mode
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.select.outputs.mode }}
      publish-plan-artifact-id: ${{ steps.select.outputs.publish-plan-artifact-id }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      # `changeset publish-plan` (which select-mode runs to detect the
      # `publish` case) shells out to the npm CLI to query the registry, and
      # Changesets v3 requires npm >= 10.9. The runner's default is older.
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: Install
        run: bun install --frozen-lockfile

      # SHA-pinned like every other changesets sub-action below: these run
      # the release pipeline, so a mutable tag here is the most sensitive
      # supply-chain edge in the repo.
      - name: Select mode
        id: select
        uses: changesets/action/select-mode@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2

  # Pending changesets: bump versions and open/update the "Version Packages" PR.
  # Holds no `id-token`, so the OIDC credential that can publish to npm simply
  # does not exist in this job.
  version:
    needs: [verify, select-mode]
    if: needs.select-mode.outputs.mode == 'version'
    name: version packages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # `contents: write` to create the version commit, `pull-requests: write`
    # to open/update the PR. No `id-token` — see above.
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Don't persist the checkout token: `bun install` below executes
      # third-party lifecycle scripts, which must not find a push-capable
      # credential in .git/config. The action doesn't need one — it commits
      # through the GitHub API (see push-with-git-cli below).
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # Required by changesets to read the full git history.
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: Install
        run: bun install --frozen-lockfile

      - name: Create or update the Version Packages PR
        uses: changesets/action/version@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          # Bumps versions in pending changesets, then refreshes the lockfile.
          script: bun run changeset:version
          # Leave at the default (false): the version commit is created via
          # the GitHub API, so GitHub signs it with its own GPG key and it
          # lands on the PR as Verified rather than unsigned. It also means
          # no authenticated git remote is ever needed in this job.
          push-with-git-cli: false

  # No changesets left: build the release artifacts. This job deliberately
  # holds no write grants and no `id-token` — it is where third-party build
  # and lifecycle scripts run, so it must not be able to publish anything.
  # It emits signed-off tarballs that the publish job below uploads verbatim.
  pack:
    needs: [verify, select-mode]
    if: needs.select-mode.outputs.mode == 'publish'
    name: pack release tarballs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      pack-dir-artifact-id: ${{ steps.pack.outputs.pack-dir-artifact-id }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      # `changeset pack` shells out to the npm CLI to build each tarball.
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: Install
        run: bun install --frozen-lockfile

      # Builds dist/, then rewrites `workspace:*` specifiers to real semver
      # ranges. This MUST happen before `changeset pack` — the tarballs freeze
      # each manifest, and npm does not understand the `workspace:` protocol,
      # so packing first would ship uninstallable packages.
      #
      # It runs only on this publish path, so `workspace:*` stays untouched in
      # the Version PR and on main.
      - name: Build and rewrite workspace deps
        run: bun run changeset:prepack

      - name: Pack
        id: pack
        uses: changesets/action/pack@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          publish-plan-artifact-id: ${{ needs.select-mode.outputs.publish-plan-artifact-id }}

  # Upload the tarballs packed above and cut the git tags / GitHub releases.
  # This is the only job that ever holds `id-token: write`, and it runs no
  # build scripts of its own — it publishes bytes that `pack` already produced.
  publish:
    needs: pack
    name: publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # `id-token: write` for the npm OIDC trusted-publisher flow; `contents:
    # write` to push git tags and create GitHub releases. No
    # `pull-requests` grant — this path never touches a PR.
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      # OIDC trusted publishing needs npm >= 11.5 — the first version that
      # authenticates to npm with the GitHub OIDC token rather than an
      # NPM_TOKEN secret. Node 24 ships npm 11+, so no explicit upgrade is
      # needed (the in-place `npm install -g npm@latest` from npm 10 is buggy
      # on hosted runners). `bun publish` does not support provenance, which
      # is why the upload runs through the npm CLI under the hood.
      - name: Setup Node.js (for npm publish)
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Install
        run: bun install --frozen-lockfile

      - name: Publish
        uses: changesets/action/publish@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          # Publishes the already-packed tarballs rather than re-resolving the
          # workspace, so what reaches npm is exactly what `pack` produced.
          pack-dir-artifact-id: ${{ needs.pack.outputs.pack-dir-artifact-id }}
